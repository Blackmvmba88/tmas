[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackmamba-visual-index"
version = "0.7.0"
description = "Visual-system control map with pixel evidence, PR reporting, Neon Glass presets and an interactive UI component lab"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "BlackMamba RECORDS" }]
license = { text = "Proprietary" }
dependencies = ["Pillow>=10.0"]

[project.scripts]
visual-index = "visual_index.cli:main"

[tool.setuptools.packages.find]
include = ["visual_index*"]
